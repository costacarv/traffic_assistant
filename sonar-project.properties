# Subtitua com a chave do projeto e nome da sua organização registrados no SonarCloud
sonar.projectKey=costacarv_traffic_assistant
sonar.organization=costacarv

# Pastas de código-fonte que serão analisadas
sonar.sources=api

# Pasta de testes e exclusions
sonar.tests=tests
sonar.exclusions=**/tests/**,**/__pycache__/**,**/monitoring/**,frontend/**

# Caminho do relatório de cobertura de código gerado pelo pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8