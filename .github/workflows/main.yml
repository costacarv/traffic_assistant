name: CI/CD Pipeline - AWS Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências para teste
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Executar Testes Unitários
      env:
        GROQ_API_KEY: "mock_key_for_ci"
      run: |
        pytest -v

  deploy-to-aws:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Deploy via SSH na Instância EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Navega até o repositório no servidor
          cd ~/mlops-legal-assistant || git clone https://github.com/${{ github.repository }}.git ~/mlops-legal-assistant
          cd ~/mlops-legal-assistant

          # Atualiza o código fonte
          git pull origin main

          # Injeta as Secrets no arquivo .env da EC2 em tempo de deploy
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "HF_TOKEN=${{ secrets.HUGGINGFACEHUB_API_TOKEN }}" >> .env

          # Sobe/atualiza a aplicação completa via Docker Compose
          docker compose up -d --build