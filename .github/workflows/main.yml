name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependências leves para teste
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic prometheus-client prometheus-fastapi-instrumentator pytest httpx

    - name: Executar Testes Unitários
      run: |
        pytest -v

    - name: Build da Imagem Docker
      if: success()
      run: |
        docker build -t mlops-legal-assistant-api .