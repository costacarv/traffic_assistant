name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências para teste
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install langchain-classic pytest httpx

    - name: Executar Testes Unitários
      run: |
        pytest -v

    - name: Build da Imagem Docker
      if: success()
      run: |
        docker build -t mlops-legal-assistant-api .