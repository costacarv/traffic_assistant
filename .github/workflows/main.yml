name: CI/CD Pipeline - AWS Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Desativa shallow clone para que o SonarCloud analise a história dos commits

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx2

      - name: Executar testes e gerar relatório de cobertura
        env:
          GROQ_API_KEY: "mock_key_for_ci"
        run: |
          pytest --cov=api --cov-report=xml:coverage.xml tests/

      - name: SonarCloud Scan  
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=costacarv
            -Dsonar.projectKey=costacarv_traffic_assistant

  dast-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências da API
        run: |
          python -m pip install --upgrade pip
          # Instala as dependências reais para evitar conflitos de metaclass
          pip install -r requirements.txt
          pip install fastapi uvicorn pydantic

      - name: Gerar OpenAPI Spec via código
        env:
          GROQ_API_KEY: "mock_key_for_openapi"
        run: |
          python -c "
          import json
          import sys
          try:
              from api.main import app
              openapi_schema = app.openapi()
              openapi_schema['servers'] = [{'url': 'http://localhost:8000'}]
              with open('openapi.json', 'w') as f:
                  json.dump(openapi_schema, f)
          except Exception as e:
              print(f'Error generating OpenAPI spec: {e}')
              sys.exit(1)
          "

      - name: Iniciar API FastAPI em background
        env:
          GROQ_API_KEY: "mock_key_for_openapi"
          # Adicione o token do Hugging Face para acelerar o download e evitar rate limits
          HF_TOKEN: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}
        run: |
          echo "Iniciando Uvicorn..."
          nohup uvicorn api.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          
          echo "Aguardando a API ficar online (isso pode levar alguns minutos devido ao download do modelo)..."
          # Aumentamos para 40 tentativas com 5 segundos de intervalo (aprox. 3.3 minutos de espera máxima)
          curl --retry 40 --retry-delay 5 --retry-connrefused -f http://localhost:8000/openapi.json || {
            echo "::error::API falhou ao iniciar a tempo. Logs do Uvicorn:"
            cat api.log
            exit 1
          }

      - name: Executar OWASP ZAP Scan (DAST)
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'openapi.json'
          format: 'openapi'
          fail_action: false

  deploy-to-aws:
    needs: [build-and-test, dast-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Deploy via SSH na Instância EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/mlops-legal-assistant
          
          # Força a sincronização limpa com o repositório remoto
          git fetch origin main
          git reset --hard origin/main
          
          # Garante a recriação das variáveis no .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "HF_TOKEN=${{ secrets.HUGGINGFACEHUB_API_TOKEN }}" >> .env

          # Recompila e reinicia os serviços
          docker compose up -d --build
    
  