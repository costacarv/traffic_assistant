name: CI/CD Pipeline - AWS Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Desativa shallow clone para que o SonarCloud analise a história dos commits

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx2

      - name: Executar testes e gerar relatório de cobertura
        env:
          GROQ_API_KEY: "mock_key_for_ci"
        run: |
          pytest --cov=api --cov-report=xml:coverage.xml tests/

      - name: SonarCloud Scan 
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=costacarv
            -Dsonar.projectKey=costacarv_traffic_assistant

  dast-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências leves para OpenAPI
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic

      - name: Gerar OpenAPI Spec via código
        run: |
          python -c "
          import json
          from unittest.mock import MagicMock
          import sys

          # Mocks para evitar importar dependências pesadas de RAG/IA no runner
          sys.modules['langchain'] = MagicMock()
          sys.modules['langchain_community'] = MagicMock()
          sys.modules['langchain_core'] = MagicMock()
          
          from api.main import app
          with open('openapi.json', 'w') as f:
              json.dump(app.openapi(), f)
          "

      - name: Executar OWASP ZAP Scan (DAST)
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'openapi.json'
          format: 'openapi'
          fail_action: false

  deploy-to-aws:
    needs: [build-and-test, dast-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Deploy via SSH na Instância EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/mlops-legal-assistant
          
          # Força a sincronização limpa com o repositório remoto
          git fetch origin main
          git reset --hard origin/main
          
          # Garante a recriação das variáveis no .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "HF_TOKEN=${{ secrets.HUGGINGFACEHUB_API_TOKEN }}" >> .env

          # Recompila e reinicia os serviços
          docker compose up -d --build
    
  